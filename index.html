<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThumbGrab — YouTube Thumbnail Downloader</title>
<meta name="description" content="Download YouTube video thumbnails in high quality.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:Inter,Arial,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% 0%,#252525 0,#111 42%,#070707 100%);
  display:flex;justify-content:center;padding:24px 16px;
}
.wrap{width:100%;max-width:900px;margin:auto}
.card{
  background:rgba(20,20,20,.96);border:1px solid #303030;border-radius:28px;
  padding:42px;box-shadow:0 25px 80px rgba(0,0,0,.55)
}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px}
.yt{width:48px;height:34px;border-radius:10px;background:#ff0033;display:grid;place-items:center}
.tri{width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:13px solid #fff;margin-left:3px}
h1{text-align:center;font-size:clamp(30px,6vw,48px);letter-spacing:-1.5px}
.sub{text-align:center;color:#a8a8a8;margin:12px auto 32px;max-width:620px;line-height:1.6}
.search{display:flex;gap:10px}
input{
  flex:1;min-width:0;height:60px;background:#0c0c0c;border:1px solid #3a3a3a;
  color:#fff;border-radius:14px;padding:0 18px;font-size:16px;outline:none
}
input:focus{border-color:#ff1744;box-shadow:0 0 0 3px rgba(255,23,68,.12)}
button{
  border:0;border-radius:14px;height:60px;padding:0 24px;background:#ff1744;color:#fff;
  font-weight:800;font-size:15px;cursor:pointer;transition:.18s
}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:scale(.98)}
.msg{display:none;margin-top:12px;color:#ff8c9f;font-size:14px}
.result{display:none;margin-top:28px}
.preview{overflow:hidden;border:1px solid #353535;background:#090909;border-radius:18px}
.preview img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.secondary{background:#252525;border:1px solid #414141}
.meta{display:flex;justify-content:space-between;color:#888;font-size:13px;margin-top:12px}
.tip{margin-top:28px;padding:15px 16px;border-radius:14px;background:#111;border:1px solid #292929;color:#999;font-size:13px;line-height:1.5}
.footer{text-align:center;color:#666;font-size:12px;margin-top:24px}
@media(max-width:650px){
 .card{padding:28px 18px;border-radius:22px}
 .search{flex-direction:column}
 input,button{width:100%}
 .actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <div class="brand"><div class="yt"><div class="tri"></div></div></div>
    <h1>YouTube Thumbnail Downloader</h1>
    <p class="sub">Paste any YouTube video link and get its available thumbnail in high quality.</p>

    <div class="search">
      <input id="url" type="url" placeholder="Paste YouTube URL here..." autocomplete="off">
      <button id="get">Get Thumbnail</button>
    </div>
    <div id="msg" class="msg"></div>

    <section id="result" class="result">
      <div class="preview"><img id="thumb" alt="YouTube thumbnail preview"></div>
      <div class="actions">
        <button id="download">↓ Download Thumbnail</button>
        <button id="open" class="secondary">↗ Open Full Size</button>
      </div>
      <div class="meta"><span>Thumbnail ready</span><span id="quality">High Quality</span></div>
    </section>

    <div class="tip">Tip: Works with youtube.com/watch, youtu.be, YouTube Shorts and embed links.</div>
    <div class="footer">© 2026 ThumbGrab</div>
  </main>
</div>

<script>
const input=document.getElementById('url');
const get=document.getElementById('get');
const msg=document.getElementById('msg');
const result=document.getElementById('result');
const thumb=document.getElementById('thumb');
const download=document.getElementById('download');
const open=document.getElementById('open');
let currentUrl='', videoId='';

function showError(t){msg.textContent=t;msg.style.display='block';result.style.display='none'}
function hideError(){msg.style.display='none'}

function extractId(value){
  try{
    const u=new URL(value.trim());
    const host=u.hostname.replace(/^www\./,'').toLowerCase();
    if(host==='youtu.be') return u.pathname.split('/').filter(Boolean)[0]||null;
    if(host==='youtube.com' || host==='m.youtube.com'){
      if(u.searchParams.get('v')) return u.searchParams.get('v');
      const parts=u.pathname.split('/').filter(Boolean);
      if(parts[0]==='shorts'||parts[0]==='embed'||parts[0]==='live') return parts[1]||null;
    }
  }catch(e){}
  return null;
}

function validId(id){return !!id && /^[A-Za-z0-9_-]{6,20}$/.test(id)}

function getThumb(){
  hideError();
  const id=extractId(input.value);
  if(!validId(id)){showError('Please paste a valid YouTube video URL.');return}
  videoId=id;
  get.disabled=true;get.textContent='Loading...';
  const max=`https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
  const high=`https://img.youtube.com/vi/${id}/hqdefault.jpg`;
  const test=new Image();
  test.onload=()=>{
    currentUrl=max;thumb.src=max;result.style.display='block';
    get.disabled=false;get.textContent='Get Thumbnail';
  };
  test.onerror=()=>{
    currentUrl=high;thumb.src=high;result.style.display='block';
    get.disabled=false;get.textContent='Get Thumbnail';
  };
  test.src=max;
}

async function downloadThumb(){
  if(!currentUrl)return;
  try{
    const r=await fetch(currentUrl);
    if(!r.ok)throw new Error();
    const blob=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`youtube-thumbnail-${videoId}.jpg`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){
    window.open(currentUrl,'_blank');
  }
}
get.addEventListener('click',getThumb);
download.addEventListener('click',downloadThumb);
open.addEventListener('click',()=>currentUrl&&window.open(currentUrl,'_blank'));
input.addEventListener('keydown',e=>{if(e.key==='Enter')getThumb()});
</script>
</body>
</html>
